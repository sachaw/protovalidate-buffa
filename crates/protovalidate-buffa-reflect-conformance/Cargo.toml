[package]
name = "protovalidate-buffa-reflect-conformance"
version = "0.0.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Conformance executor for protovalidate-buffa-reflect, over messages decoded from the harness's descriptors."
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "protovalidate-buffa-reflect-conformance"
path = "src/main.rs"

[[bench]]
name = "compare"
harness = false

[dependencies]
anyhow = "1"
buffa = "0.9.2"
buffa-descriptor = { version = "0.9.2", features = ["reflect"] }
buffa-types = { version = "0.9.2", features = ["reflect"] }
protovalidate-buffa = { path = "../protovalidate-buffa", version = "0.7.2", default-features = false, features = ["protos", "tz"] }
protovalidate-buffa-reflect = { path = "../protovalidate-buffa-reflect", features = ["tz"] }

[dev-dependencies]
buffa-descriptor = { version = "0.9.2", features = ["json", "reflect"] }
bytes = "1"
connectrpc = { version = "0.9", default-features = false }
protovalidate-buffa-reflect = { path = "../protovalidate-buffa-reflect", features = ["connect", "tz"] }

[build-dependencies]
buffa = "0.9.2"
buffa-build = "0.9.2"
buffa-codegen = "0.9.2"
protoc-gen-protovalidate-buffa = { path = "../protoc-gen-protovalidate-buffa", version = "0.10.5" }

[lints]
workspace = true
