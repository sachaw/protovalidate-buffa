syntax = "proto3";

package buf.validate.conformance.cases;

import "buf/validate/validate.proto";

// Indexing a list out of range is a runtime error.
message CelListIndex {
  message Child {
    string id = 1;
  }

  repeated string items = 1 [(buf.validate.field).cel = {
    id: "list.index"
    expression: "this[0] == 'x'"
  }];
  // `||` discards the error when the other side is true.
  repeated string guarded = 2 [(buf.validate.field).cel = {
    id: "list.guarded"
    expression: "this[0] == 'x' || size(this) == 0"
  }];
  // Reads the first message directly and through a projection, whose list
  // holds references.
  repeated Child children = 3 [(buf.validate.field).cel = {
    id: "list.message"
    expression: "this[0].id == this.map(c, c)[0].id"
  }];
}

message CelListNegativeIndex {
  repeated string items = 1 [(buf.validate.field).cel = {
    id: "list.negative"
    expression: "this[-1] == 'x'"
  }];
}

// `.value()` reads an optional's value, and on `optional.none()` is a
// runtime error.
message CelOptionalValue {
  option (buf.validate.message).cel = {
    id: "message.value"
    expression: "optional.of(this.child).value().id != 'x'"
  };

  message Child {
    string id = 1;
  }

  map<string, string> labels = 1 [(buf.validate.field).cel = {
    id: "map.value"
    expression: "this[?'k'].value() == 'x'"
  }];
  repeated string items = 2 [(buf.validate.field).cel = {
    id: "list.value"
    expression: "this[?0].value() == 'x'"
  }];
  Child child = 3;
}

// A message rule indexes a repeated message field and a map of messages:
// by a literal, by an index computed in a comprehension, through nested
// lists, and optionally.
message CelMessageListIndex {
  option (buf.validate.message).cel = {
    id: "list.message_index"
    expression: "size(this.children) == 0 || this.children[0].id != ''"
  };
  option (buf.validate.message).cel = {
    id: "list.computed_index"
    expression: "this.picks.all(i, this.children[int(i)].id != 'bad')"
  };
  option (buf.validate.message).cel = {
    id: "list.nested_index"
    expression: "size(this.children) < 2 || size(this.children[1].children) == 0 || this.children[1].children[0].axis < 3"
  };
  option (buf.validate.message).cel = {
    id: "list.optional_index"
    expression: "!this.children[?2].hasValue() || this.children[?2].value().id != 'none'"
  };
  option (buf.validate.message).cel = {
    id: "map.message_index"
    expression: "!('k' in this.named) || this.named['k'].id == 'k'"
  };
  option (buf.validate.message).cel = {
    id: "map.optional_index"
    expression: "!this.named[?'z'].hasValue() || this.named[?'z'].value().id == 'z'"
  };

  message Child {
    string id = 1;
    repeated Child children = 2;
    uint32 axis = 3;
  }

  repeated Child children = 1;
  repeated uint32 picks = 2;
  map<string, Child> named = 3;
}
